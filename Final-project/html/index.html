<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Browsing Human and Vertebrate genome</title>
</head>

<body style="background-color: powderblue;">

<h1>Browsing Human and Vertebrate genome</h1>

<h2>BASIC Level Services</h2>

<!-- 1) LIST SPECIES -->
<p>1) List of species in the genome database</p>
<form action="/listSpecies" method="get">
    <p>Limit:
        <input type="text" name="limit">
    </p>
    <input type="submit" value="Send">
</form>


<!-- 2) KARYOTYPE (preparado para futuro endpoint) -->
<p>2) Information about the karyotype</p>
<form action="/karyotype" method="get">
    <p>Select the species:
        <input type="text" name="species">
    </p>
    <input type="submit" value="Send">
</form>


<!-- 3) GENE INFO (preparado para futuro endpoint) -->
<p>3) Gene information</p>
<form action="/geneInfo" method="get">
    <p>Select the species:
        <input type="text" name="species">
    </p>
    <p>Select the chromosome:
        <input type="text" name="chromosome">
    </p>
    <input type="submit" value="Send">
</form>

</body>
</html>
